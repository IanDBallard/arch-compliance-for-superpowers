name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/arch-compliance/detectors/typescript/package-lock.json

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Install TypeScript detectors
        working-directory: plugins/arch-compliance/detectors/typescript
        run: npm ci

      - name: Run pytest
        run: pytest

      - name: Run TypeScript detector self-test
        working-directory: plugins/arch-compliance/detectors/typescript
        run: npm test
