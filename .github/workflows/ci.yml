name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/arch-compliance/detectors/typescript/package-lock.json

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Install TypeScript detectors
        working-directory: plugins/arch-compliance/detectors/typescript
        run: npm ci

      - name: Run pytest
        run: pytest

      - name: Run TypeScript detector self-test
        working-directory: plugins/arch-compliance/detectors/typescript
        run: npm test

      - name: Scan TypeScript fixture
        working-directory: plugins/arch-compliance/detectors/typescript
        run: npm run scan -- --file ../../../tests/fixtures/typescript/bad.tsx
