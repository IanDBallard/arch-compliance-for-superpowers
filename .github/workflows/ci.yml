name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff gate's --base needs history for the merge-base

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/arch-compliance/detectors/typescript/package-lock.json

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Install TypeScript detectors
        working-directory: plugins/arch-compliance/detectors/typescript
        run: npm ci

      - name: Run pytest
        run: pytest

      - name: Run TypeScript detector self-test
        working-directory: plugins/arch-compliance/detectors/typescript
        run: npm test

  # The check-diff composite action, run from this tree: against a planted and a clean
  # fixture host, then against this repository itself (the repository's own diff gate).
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the third run's --base needs history for the merge-base

      - name: Build fixture hosts
        env:
          PYTHONPATH: plugins/arch-compliance/python
        run: |
          python tests/action_fixture_host.py "$RUNNER_TEMP/planted" --plant empty-catch
          python tests/action_fixture_host.py "$RUNNER_TEMP/clean" --plant clean

      - name: Check-diff on the planted fixture (must fail)
        id: planted
        continue-on-error: true
        uses: ./.github/actions/check-diff
        with:
          repo: ${{ runner.temp }}/planted
          base: main

      - name: The planted run failed on the finding
        env:
          OUTCOME: ${{ steps.planted.outcome }}
        run: |
          test "$OUTCOME" = failure
          grep -q 'BLOCK fail-loud.empty-catch' "$RUNNER_TEMP/acf-check-diff.txt"

      - name: Check-diff on the clean fixture (must pass)
        id: clean
        uses: ./.github/actions/check-diff
        with:
          repo: ${{ runner.temp }}/clean
          base: main
          host-setup: touch "$RUNNER_TEMP/host-setup-ran"

      - name: The clean run passed and ran host-setup
        env:
          OUTCOME: ${{ steps.clean.outcome }}
        run: |
          test "$OUTCOME" = success
          test -f "$RUNNER_TEMP/host-setup-ran"

      - name: Check-diff on this repository
        uses: ./.github/actions/check-diff
        with:
          repo: .
