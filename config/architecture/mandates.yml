# Merged by /acf-setup from the plugin's react-app and python-service profiles
# (polyglot host: TypeScript bridge + Python package). TypeScript rows first, then Python.
# `ops.no-build-artifacts` appears in both profiles with identical content: kept once.

- id: fail-loud.empty-catch
  title: Empty catch blocks must not swallow errors
  severity: BLOCK
  detection: ast
  detector: empty_catch
  languages: typescript
  call_sites: [ci, hook]
  exemption_tokens: [fail-loud.empty-catch-ok]
  status: enforced
  arch_anchor: "## Fail loud"

- id: no-shims.explicit-any
  title: No explicit any escape hatches
  severity: WARN
  detection: ast
  detector: explicit_any
  languages: typescript
  call_sites: [ci, hook]
  exemption_tokens: [no-shims.explicit-any-ok]
  status: enforced
  arch_anchor: "## No shims"

- id: ops.no-build-artifacts
  title: No staged/committed build-output paths
  severity: BLOCK
  detection: guard
  detector: no_build_artifacts
  languages: both
  call_sites: [ci, hook]
  exemption_tokens: [ops.no-build-artifacts-ok]
  status: enforced
  arch_anchor: "## Build artifacts"
  params:
    path_prefixes: [dist/, build/]

# unenforced here: no React app; the TypeScript here is a detector bridge (spec §5.2)
- id: soft.react-boundaries
  title: Keep domain logic out of React views
  severity: WARN
  detection: llm
  detector: llm_react_boundaries
  languages: typescript
  call_sites: [ci, audit]
  exemption_tokens: [soft.react-boundaries-ok]
  status: unenforced
  arch_anchor: "## React boundaries"
  auditor: react-boundaries

- id: fail-loud.bare-except
  title: Bare except and broad Exception handlers
  severity: BLOCK
  detection: ast
  detector: fail_loud_bare_except
  languages: python
  call_sites: [ci, hook]
  exemption_tokens: [fail-loud.bare-except-ok]
  status: enforced
  arch_anchor: "## Fail loud"

- id: no-shims.hasattr
  title: No hasattr shims for optional attributes
  severity: WARN
  detection: ast
  detector: no_shims_hasattr
  languages: python
  call_sites: [ci]
  exemption_tokens: [no-shims.hasattr-ok]
  status: enforced
  arch_anchor: "## No shims"

- id: posix-paths.str-serialization
  title: No str(path) into YAML/JSON serialization
  severity: BLOCK
  detection: ast
  detector: posix_paths_str_serialization
  languages: python
  call_sites: [ci, hook]
  exemption_tokens: [posix-paths.str-serialization-ok]
  status: enforced
  arch_anchor: "## POSIX paths"

- id: fail-loud.ratchet
  title: Bare/broad-except legacy stock must not grow
  severity: BLOCK
  detection: guard
  detector: fail_loud_ratchet
  languages: python
  call_sites: [ci]
  exemption_tokens: [fail-loud.ratchet-ok]
  status: unenforced
  arch_anchor: "## Fail-loud ratchet"
  params:
    baseline: config/architecture/fail_loud_ratchet.json
    roots: ["."]
    exclude_globs: ["**/tests/**", "**/test_*.py", "**/*_test.py"]

# unenforced here: no index.yml façade in this repository (spec §5.2)
- id: facade.forbid-sink
  title: No direct writes to a protected path outside allowlisted modules
  severity: BLOCK
  detection: ast
  detector: forbid_facade_sink
  languages: python
  call_sites: [ci, hook]
  exemption_tokens: [facade.forbid-sink-ok]
  status: unenforced
  arch_anchor: "## Façade sinks"
  params:
    target_literal_re: "index\\.ya?ml"
    allowlist_globs: ["**/services/**"]
    atomic_is_sink: true

# unenforced here: no state field in this repository (spec §5.2)
- id: fsm.transition-guard
  title: State field writes must call a transition validator in-scope
  severity: BLOCK
  detection: ast
  detector: fsm_transition_guard
  languages: python
  call_sites: [ci, hook]
  exemption_tokens: [fsm.transition-guard-ok]
  status: unenforced
  arch_anchor: "## FSM transitions"
  params:
    state_field: fsm_state
    validator_name: validate_transition

- id: soft.fail-loud
  title: Soft fail-loud smells needing judgment
  severity: WARN
  detection: llm
  detector: llm_fail_loud
  languages: python
  call_sites: [ci, audit]
  exemption_tokens: [soft.fail-loud-ok]
  status: partial
  arch_anchor: "## Soft fail-loud smells"
  auditor: fail-loud

# The plugin's own rules (spec docs/design/PLUGIN_SELF_HOSTING_AND_DOCTRINE.md §5.2).
# `detection: manual`: no detector emits these ids; `detector` names the test module that
# enforces the rule, so each row is a pointer from the rule to its enforcement.

- id: plugin.one-base-exception
  title: Every ACF exception subclasses AcfError alone
  severity: BLOCK
  detection: manual
  detector: plugins/arch-compliance/tests/test_adr_exceptions.py
  languages: python
  call_sites: [audit]
  exemption_tokens: [plugin.one-base-exception-ok]
  status: enforced
  arch_anchor: "## One base exception"

