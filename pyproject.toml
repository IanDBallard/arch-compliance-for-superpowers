[project]
name = "acf"
version = "0.2.0"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
acf-check-diff = "acf.cli_check_diff:main"
acf-check-llm = "acf.cli_check_llm:main"

[tool.pytest.ini_options]
testpaths = ["plugins/arch-compliance/tests"]
pythonpath = ["plugins/arch-compliance/python"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["plugins/arch-compliance/python"]

# Non-Python files that acf code reads at runtime. Without this table setuptools
# omits them from a wheel, and the editable install used in development and CI
# hides that because Path(__file__) then resolves into the source tree.
# tests/test_packaging.py builds a real wheel and asserts every tracked non-.py
# file under acf/ is present, so a template added later cannot be forgotten.
[tool.setuptools.package-data]
acf = ["judge_prompt.md"]
